version: "3.8"
services:
  client:
    build:
      context: ../junk-hauling
      dockerfile: Dockerfile.dev
    volumes:
      - ../junk-hauling:/app
      - /app/node_modules_client
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    volumes:
      - ../server:/app
      - /app/node_modules_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
